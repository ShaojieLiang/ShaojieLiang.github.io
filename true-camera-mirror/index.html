<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>真实视角摄像头</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; background: #000; }
    body { overflow: hidden; font-family: system-ui, sans-serif; }
    #app { position: relative; width: 100%; height: 100%; background: #000; }
    video {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
      /* No scaleX(-1): the preview is intentionally unmirrored. */
    }
    #start {
      position: absolute;
      inset: 50% auto auto 50%;
      transform: translate(-50%, -50%);
      padding: 12px 18px;
      border: 1px solid #777;
      border-radius: 6px;
      color: #fff;
      background: #222;
      font: inherit;
      cursor: pointer;
    }
    #start:hover { background: #333; }
    #message {
      position: absolute;
      left: 50%;
      bottom: 22px;
      transform: translateX(-50%);
      max-width: calc(100% - 32px);
      padding: 8px 12px;
      border-radius: 5px;
      color: #ddd;
      background: rgb(0 0 0 / 72%);
      font-size: 14px;
      text-align: center;
    }
    #fullscreen {
      position: absolute;
      right: 16px;
      bottom: 16px;
      padding: 7px 10px;
      border: 1px solid #555;
      border-radius: 5px;
      color: #ddd;
      background: rgb(0 0 0 / 65%);
      font: inherit;
      cursor: pointer;
    }
    #fullscreen[hidden], #message[hidden], #start[hidden] { display: none; }
  </style>
</head>
<body>
  <main id="app">
    <video id="preview" autoplay playsinline muted></video>
    <button id="start" type="button">打开摄像头</button>
    <button id="fullscreen" type="button" hidden>全屏</button>
    <div id="message" role="status" hidden></div>
  </main>

  <script>
    const app = document.getElementById('app');
    const preview = document.getElementById('preview');
    const start = document.getElementById('start');
    const fullscreen = document.getElementById('fullscreen');
    const message = document.getElementById('message');
    let stream;

    function showMessage(text) {
      message.textContent = text;
      message.hidden = !text;
    }

    async function openCamera() {
      start.disabled = true;
      showMessage('正在请求摄像头权限…');
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          audio: false,
          video: {
            width: { ideal: 1920, max: 3840 },
            height: { ideal: 1080, max: 2160 },
            frameRate: { ideal: 30, max: 60 }
          }
        });
        preview.srcObject = stream;
        await preview.play();
        start.hidden = true;
        fullscreen.hidden = false;
        const settings = stream.getVideoTracks()[0].getSettings();
        showMessage(`${settings.width || '?'} × ${settings.height || '?'} · 未镜像`);
        window.setTimeout(() => { message.hidden = true; }, 2200);
      } catch (error) {
        start.disabled = false;
        const reason = error.name === 'NotAllowedError'
          ? '摄像头权限未开启，请允许此网页使用摄像头。'
          : error.name === 'NotFoundError'
            ? '没有找到可用的摄像头。'
            : `摄像头无法打开：${error.message || error.name}`;
        showMessage(reason);
      }
    }

    async function enterFullscreen() {
      if (!document.fullscreenElement) {
        await app.requestFullscreen?.();
      } else {
        await document.exitFullscreen?.();
      }
    }

    start.addEventListener('click', openCamera);
    fullscreen.addEventListener('click', enterFullscreen);
    preview.addEventListener('dblclick', enterFullscreen);
    window.addEventListener('beforeunload', () => {
      stream?.getTracks().forEach(track => track.stop());
    });
  </script>
</body>
</html>
